<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="saafiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CE8E"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <linearGradient id="saafiDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E26"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>
    <linearGradient id="saafiCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A4E"/>
      <stop offset="100%" stop-color="#E0382D"/>
    </linearGradient>
  </defs>

  <!-- Luxury Obsidian Medallion Base with Chamfered Soft Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#saafiDark)" stroke="url(#saafiGold)" stroke-width="1.5"/>

  <!-- Inset Filigree Border -->
  <rect x="12" y="12" width="96" height="96" rx="20" fill="none" stroke="url(#saafiGold)" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Concentric Geometric Frames -->
  <circle cx="60" cy="60" r="43" fill="none" stroke="url(#saafiCoral)" stroke-width="1" stroke-opacity="0.85"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#saafiGold)" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.6"/>

  <!-- Architectural 45-degree Inset Diamond Accent -->
  <rect x="36" y="36" width="48" height="48" rx="4" transform="rotate(45 60 60)" fill="none" stroke="url(#saafiGold)" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Cardinal Points -->
  <polygon points="60,19 62.5,23 60,27 57.5,23" fill="url(#saafiGold)"/>
  <polygon points="60,93 62.5,97 60,101 57.5,97" fill="url(#saafiGold)"/>
  <polygon points="19,60 23,62.5 27,60 23,57.5" fill="url(#saafiGold)"/>
  <polygon points="93,60 97,62.5 101,60 97,57.5" fill="url(#saafiGold)"/>

  <!-- Bespoke Luxury Serif S Monogram -->
  <path d="M 72 43 C 70 38, 65.5 35.5, 59 35.5 C 50.5 35.5, 46 40.5, 46 47.5 C 46 54.5, 51.5 58, 60 61 C 69 64, 74 67.5, 74 75 C 74 82.5, 68.5 87.5, 59 87.5 C 51 87.5, 46 84, 44 79" 
        stroke="url(#saafiGold)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Serif Finials -->
  <circle cx="72" cy="43" r="1.5" fill="url(#saafiGold)"/>
  <circle cx="44" cy="79" r="1.5" fill="url(#saafiGold)"/>
  
  <!-- Center Axis Accent Stars -->
  <circle cx="60" cy="31" r="1.5" fill="url(#saafiCoral)"/>
  <circle cx="60" cy="89" r="1.5" fill="url(#saafiCoral)"/>
</svg>